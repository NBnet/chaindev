[package]
name = "chaindev"
version = "0.54.4"
edition = "2024"
authors = ["hui.fan@mail.ru"]
description = "Powerful development and testing utils for blockchain developers."
homepage = "https://github.com/rust-util-collections/chaindev"
repository = "https://github.com/rust-util-collections/chaindev"
keywords = ["blockchain", "tendermint", "substrate", "development"]
license = "GPL-3.0"

# build = "build.rs"

[package.metadata.docs.rs]
features = [ "beacon_based" ]

[dependencies]
nix = { version = "0.32.0", features = [ "net", "process", "user", "hostname" ] }
rand = "0.10.4"
parking_lot = "0.13.0"

serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.154"
serde_yml = "0.0.13"

ruc = { version = "11.0.3", features = [ "cmd", "ssh" ] }
vsdb = "17.0.19"

tendermint = { version = "0.41.0", optional = true }
tendermint-config = { version = "0.41.0", optional = true }
toml_edit = { version = "0.25.19", optional = true }

[features]
default = [ "beacon_based" ]

beacon_based = [ "vsdb_prelude" ]

tendermint_based = [
    "vsdb_prelude",
    "tendermint",
    "tendermint-config",
    "toml_edit"
]

# Kept as a feature gate. vsdb 17 has no parity/msgpack/compress features.
vsdb_prelude = []

[patch.crates-io]
# ruc = { path = "../ruc" }
# vsdb = { path = "../vsdb/wrappers" }
